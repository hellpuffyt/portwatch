[package]
name = "portwatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
authors = ["Prabesh Sharma"]
description = "Inventory listening ports and their owning processes, and report what changed since the last snapshot."
license = "MIT"
repository = "https://github.com/hellpuffyt/portwatch"
readme = "README.md"
keywords = ["ports", "netstat", "security", "cli", "monitoring"]
categories = ["command-line-utilities"]
exclude = ["/.github"]

[[bin]]
name = "portwatch"
path = "src/main.rs"

[lib]
name = "portwatch"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
